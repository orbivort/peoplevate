# Dependabot: automated dependency updates.
#
# Policy, enforced by the `groups` rules below — do not weaken without review:
#
#   1. Minor and patch updates for the whole workspace land in ONE grouped pull
#      request per week. Groups never split by dependency type, so production and
#      development bumps share a single PR instead of one PR each.
#   2. Every major update is raised as its own pull request. Groups are limited
#      to `update-types: [minor, patch]`, so a major matches no group and
#      Dependabot opens an individual PR for it. Never add `major` to a group's
#      `update-types`, and never drop the key: omitting it means "all updates".
#   3. Security updates are deliberately not grouped (`applies-to` defaults to
#      `version-updates`) and are exempt from the cooldowns below, so a fix
#      reaches review as its own PR immediately.
#   4. `cooldown` withholds new releases before they are proposed, mirroring the
#      `minimumReleaseAge` supply-chain gate in pnpm-workspace.yaml. It applies
#      to version updates only; ecosystems without an explicit `cooldown` block
#      still get GitHub's built-in 3-day default.
#
# Ecosystems:
#   npm            — ONE entry at the workspace root. It covers the root manifest
#                    and every package under packages/*, which is not a style
#                    choice but the only mode that works: pnpm keeps a single
#                    shared pnpm-lock.yaml at the root and resolves "catalog:"
#                    specifiers through pnpm-workspace.yaml, and Dependabot only
#                    performs that workspace-aware step when the update starts
#                    at the root. A per-directory npm entry (e.g.
#                    /packages/frontend) resolves the subpackage in isolation,
#                    fails before it can write the lockfile, and still opens a
#                    manifest-only PR — which CI rejects under
#                    `pnpm install --frozen-lockfile` with
#                    ERR_PNPM_OUTDATED_LOCKFILE. Do not reintroduce
#                    /packages/* npm entries.
#   docker         — backend/frontend Dockerfiles. Only literal image tags are
#                    machine-trackable; the Node base image is driven by the
#                    NODE_VERSION build ARG and is bumped by hand.
#   docker-compose — the root compose stack.
#   github-actions — CI action versions.
#
# `engines` and `packageManager` are pinned manually and are not managed by
# Dependabot, so they need no `ignore` entry. Shared versions live in the pnpm
# catalog (pnpm-workspace.yaml); keep it the single source of truth for
# everything referenced via "catalog:".
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      # Off-peak and after the Monday 03:00 security scan.
      time: '04:00'
      timezone: Etc/UTC
    # One grouped PR for the whole workspace plus one PR per major update.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      workspace-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # @types/node tracks the pinned runtime (engines.node ^24); its major
      # releases describe APIs Node 24 does not have.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/packages/backend'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-base-image:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: '/packages/frontend'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-base-image:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose-images:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
