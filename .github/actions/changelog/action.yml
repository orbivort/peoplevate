# Reusable changelog action shared by the release workflow.
#
# Produces the GitHub Release body for the tag that triggered the run. The
# preferred source is the version's section in CHANGELOG.md (written by the
# Prepare Release workflow and reviewed in the release pull request - single
# source of truth). When CHANGELOG.md has no section for the version (e.g. a
# manually pushed tag), the notes fall back to being generated from the
# conventional commits introduced since the previous tag.
#
# The calling job MUST run `actions/checkout@v5` with `fetch-depth: 0` first so
# the fallback can diff the tag range and the shared scripts are present
# (mirrors the setup composite action which also leaves checkout to the caller).
name: Generate changelog
description: >
  Build a GitHub Release body from the version's CHANGELOG.md section, falling
  back to conventional commits since the previous tag.

inputs:
  previous-tag:
    description: >
      Optional tag to diff against in the fallback path. When empty (no
      previous release), the log starts from the repository root.
    required: false
    default: ''

outputs:
  body:
    description: Markdown body for the GitHub Release.
    value: ${{ steps.generate.outputs.body }}
  source:
    description: 'Where the notes came from: "changelog-file" or "commits".'
    value: ${{ steps.generate.outputs.source }}

runs:
  using: composite
  steps:
    - name: Generate release notes
      id: generate
      shell: bash
      run: |
        set -euo pipefail

        # GitHub ref names carry the "v" prefix (e.g. v1.2.3); the changelog
        # headings and scripts work with the bare version.
        VERSION="${GITHUB_REF_NAME#v}"

        if node .github/scripts/extract-changelog.mjs "$VERSION" > notes.md; then
          SOURCE=changelog-file
        else
          SOURCE=commits
          echo "No CHANGELOG.md section for $VERSION; generating notes from commits."
          # Resolve the range to diff: <previous>..HEAD, or the full history
          # when there is no previous tag (first release / manual tag).
          PREV="${{ inputs.previous-tag }}"
          FROM=""
          if [[ -n "$PREV" ]] \
            && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            FROM="$PREV"
          fi
          node .github/scripts/changelog.mjs "$VERSION" "$FROM" > notes.md
        fi
        echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

        # Load the notes into the output using the heredoc method, which
        # preserves embedded newlines (unlike the deprecated ::set-output).
        # Use an unlikely delimiter to avoid colliding with release body text.
        {
          echo "body<<GH_RELEASE_BODY_EOF"
          cat notes.md
          echo "GH_RELEASE_BODY_EOF"
        } >> "$GITHUB_OUTPUT"
        rm -f notes.md
