name: Bug report
description: Report a bug or unexpected behavior in the application.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible to help us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages, logs, screenshots).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the application is affected?
      multiple: true
      options:
        - Frontend
        - Backend / API
        - Database / Data
        - Authentication / Access control
        - CI / Build
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser / OS / Node version etc.
      placeholder: 'e.g. Chrome 126 on Windows 11, Node 24'
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, links, or suggestions about the issue.
