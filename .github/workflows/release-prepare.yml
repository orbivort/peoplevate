name: Prepare Release

# First phase of the release process: computes the next version, bumps the
# package.json version fields, writes the CHANGELOG.md section from
# conventional commits, and opens a release pull request for review.
#
# Nothing is tagged or published here - the Publish Release workflow tags
# `main` only after the release PR is reviewed and merged. For the full flow
# see the "Release Process" section in CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version bump to apply. "auto" derives it from conventional commits
          (breaking -> major, feat -> minor, fix/perf -> patch, else patch).
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch
      version:
        description: 'Explicit version to release (e.g. "1.2.3"). Overrides "bump" when set.'
        required: false
        default: ''

# `contents: write` pushes the release branch; `pull-requests: write` opens
# the release PR. Nothing else is granted.
#
# Opening the PR with the default GITHUB_TOKEN additionally requires the
# repo/org setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General). If that setting is disabled, the workflow
# falls back to the optional `RELEASE_BOT_TOKEN` PAT secret (see the
# "Required repo/org setup for release pull requests" section in
# CONTRIBUTING.md).
permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize preparation so two maintainers can't open competing release PRs.
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version & open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (full history)
        # Full history is required to diff the current version against the
        # previous tag when deriving the bump and the changelog section.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPLICIT_VERSION" ]]; then
            if ! [[ "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
              echo "::error::Invalid version '$EXPLICIT_VERSION'. Expected semver such as 1.2.3."
              exit 1
            fi
            NEXT="$EXPLICIT_VERSION"
          else
            # Prints only the version on stdout; aborts on empty history.
            NEXT="$(node .github/scripts/next-version.mjs --bump "$BUMP")"
          fi
          TAG="v$NEXT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Delete it or pick another version."
            exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next release: $TAG"

      - name: Bump package.json versions
        # Root + backend + frontend release manifests, kept in lockstep with the git tag.
        run: node .github/scripts/bump-version.mjs "${{ steps.version.outputs.version }}"

      - name: Update CHANGELOG.md
        # Prepends a Keep-a-Changelog section generated from conventional
        # commits since the previous tag.
        run: node .github/scripts/update-changelog.mjs "${{ steps.version.outputs.version }}"

      - name: Commit and push release branch
        env:
          BRANCH: release/${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A previous run may already have opened the PR for this tag (the
          # workflow is re-runnable by design). If so, the branch is in review:
          # do not rebuild or overwrite it. The Open release pull request step
          # below reports the existing PR and exits cleanly.
          existing_pr_url="$(gh pr view "$BRANCH" --json state,url -q 'select(.state == "OPEN") | .url' 2>/dev/null || true)"
          if [[ -n "$existing_pr_url" ]]; then
            echo "Release PR for $BRANCH is already open: $existing_pr_url"
            exit 0
          fi

          git checkout -b "$BRANCH"
          # Stage only the files the release tooling touches; any local runner
          # artifacts must never leak into the release PR.
          git add package.json packages/backend/package.json packages/frontend/package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"

          # The release/v* branch can already exist from an earlier run that
          # failed before it could open the PR. A plain push would then be
          # rejected as non-fast-forward (the new commit is based on current
          # main, not on the stale remote tip), so refresh the automation-owned
          # branch with a force-with-lease push. The lease only overwrites the
          # tip we just fetched and aborts if the branch moved concurrently.
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git push --force-with-lease origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi

      - name: Open release pull request
        env:
          # The default GITHUB_TOKEN cannot create PRs when the repo/org
          # disables "Allow GitHub Actions to create and approve pull requests"
          # (Settings > Actions > General). If that setting is off, create a
          # fine-grained PAT with Contents: read/write and Pull requests: write
          # on this repository, store it in the RELEASE_BOT_TOKEN secret, and
          # this step retries with it automatically.
          BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Embed the exact changelog section in the PR body so reviewers see
          # what the GitHub Release will contain.
          node .github/scripts/extract-changelog.mjs "$VERSION" > changelog-section.md
          {
            echo "Automated release PR for **$TAG**, prepared by the Prepare Release workflow."
            echo
            echo "Merging this PR triggers the Publish Release workflow, which tags \`main\`"
            echo "with \`$TAG\` and runs the Release workflow (Docker images + GitHub Release)."
            echo
            echo "## Changelog"
            echo
            cat changelog-section.md
            echo
            echo "## Review checklist"
            echo
            echo "- [ ] Version bump is correct (\`package.json\`, \`packages/backend/package.json\`, \`packages/frontend/package.json\`)"
            echo "- [ ] CHANGELOG.md section accurately describes the changes"
            echo "- [ ] \`pnpm ci\` passes on this branch"
          } > pr-body.md

          # Report the URL of an existing open release PR instead of failing on
          # a duplicate. Re-runs are safe: the Commit and push release branch
          # step above skips the branch when its PR is already open, so this
          # fallback only matters when an earlier attempt pushed the branch but
          # never managed to open the PR.
          find_existing_pr() {
            # Only an *open* PR counts as "already exists"; a closed one means
            # the branch is stale and was just refreshed by this run.
            gh pr view "release/$TAG" --json state,url -q 'select(.state == "OPEN") | .url' 2>/dev/null || true
          }
          export GH_TOKEN="$GITHUB_TOKEN"
          EXISTING_URL="$(find_existing_pr)"
          if [[ -z "$EXISTING_URL" && -n "$BOT_TOKEN" ]]; then
            export GH_TOKEN="$BOT_TOKEN"
            EXISTING_URL="$(find_existing_pr)"
          fi
          if [[ -n "$EXISTING_URL" ]]; then
            echo "A release PR for $TAG already exists: $EXISTING_URL"
            rm -f changelog-section.md pr-body.md
            exit 0
          fi

          # No --label here: a missing label would fail the whole call.
          # Release PRs are recognized by their `release/v*` head branch.
          create_pr() {
            gh pr create \
              --base main \
              --head "release/$TAG" \
              --title "chore(release): $TAG" \
              --body-file pr-body.md
          }

          # Try the default token first; when the repo/org blocks PR creation
          # by GitHub Actions it is rejected, so retry with the PAT if set.
          export GH_TOKEN="$GITHUB_TOKEN"
          PR_CREATED=false
          if create_pr; then
            PR_CREATED=true
          elif [[ -n "$BOT_TOKEN" ]]; then
            echo "::notice::GITHUB_TOKEN was blocked from creating the PR; retrying with the RELEASE_BOT_TOKEN secret..."
            export GH_TOKEN="$BOT_TOKEN"
            if create_pr; then
              PR_CREATED=true
            fi
          fi
          rm -f changelog-section.md pr-body.md

          if [[ "$PR_CREATED" != true ]]; then
            if [[ -n "$BOT_TOKEN" ]]; then
              echo "::error::Neither GITHUB_TOKEN nor the RELEASE_BOT_TOKEN secret was permitted to create the release PR."
              echo "::error::Check that RELEASE_BOT_TOKEN is a valid fine-grained PAT with Contents: read/write and Pull requests: write on this repository."
            else
              echo "::error::The default GITHUB_TOKEN was not permitted to create the release PR."
              echo "::error::Fix ONE of the following and re-run this workflow (the pushed release/$TAG branch is reused):"
              echo "::error::  1) Enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General (if greyed out, an org owner must enable it at the organization level)."
              echo "::error::  2) Add a RELEASE_BOT_TOKEN repository secret: a fine-grained PAT with Contents: read/write and Pull requests: write on this repository."
            fi
            echo "::error::Alternatively, open the PR manually from the pushed release/$TAG branch with title 'chore(release): $TAG'."
            exit 1
          fi
