name: Publish Release

# Second phase of the release process: runs when a release pull request
# (head branch `release/v*`, opened by the Prepare Release workflow) is
# merged. It verifies the release metadata, tags `main` with `vX.Y.Z`, and
# dispatches the Release workflow for the tag (Docker images + GitHub
# Release). For the full flow see the "Release Process" section in
# CONTRIBUTING.md.
on:
  pull_request:
    types: [closed]
  # Escape hatch for the case where the merged-PR run above could not publish
  # (e.g. a step failed and the run cannot be re-run, or the tag push was
  # rejected). Re-running a failed run replays the workflow definition pinned
  # to *that* run's commit, so a fix landed on `main` afterwards is only
  # picked up by a freshly dispatched run like this one. Supply the same
  # version the release PR carried; the metadata guard below still rejects a
  # version that `package.json`/CHANGELOG.md on the dispatched ref do not
  # match, so run this on `main` (or on the interrupted release commit).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. "1.0.3" or "v1.0.3" (tagged as v1.0.3).'
        required: true
        type: string

# `contents: write` creates and pushes the annotated tag; `actions: write` is
# required to dispatch the Release workflow via the API. Nothing else is
# granted.
permissions:
  contents: write
  actions: write

concurrency:
  # Share the group with Release so a publish never races a tag-triggered run.
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Normal path: a merged `release/v*` PR. Manual path: an operator supplied
    # the version to publish through `workflow_dispatch`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    steps:
      - name: Derive version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Populated for a merged release PR (empty on manual dispatch).
          BRANCH: ${{ github.event.pull_request.head.ref }}
          # Populated on manual dispatch (empty for a merged release PR).
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            # Accept both "1.2.3" and "v1.2.3" so the input can be pasted from
            # either the release PR title or the tag.
            RAW="${INPUT_VERSION#v}"
          else
            RAW="${BRANCH#release/}" # release/v1.2.3 -> v1.2.3
          fi
          TAG="v${RAW#v}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::Unexpected version '$RAW'. Expected 'X.Y.Z' (manual input) or 'release/vX.Y.Z' (release branch)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Checkout the commit to tag (full history)
        # Merged-PR run: the PR's merge commit. Manual run: the ref picked in
        # the dispatch dialog (`main`, or the interrupted release commit).
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release metadata
        # Fails the publish if package.json or CHANGELOG.md drifted from the
        # reviewed release PR (e.g. main moved ahead between PR creation and
        # merge), or when a manually dispatched version does not match the
        # checked-out ref.
        run: node .github/scripts/verify-release.mjs "${{ steps.version.outputs.version }}"

      - name: Create and push the release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          # Annotated tags embed a tagger identity, which GitHub runners have
          # none of by default. Use the same fixed automation identity as the
          # Prepare Release workflow: hardcoding it is required because
          # GITHUB_TOKEN is an installation token and cannot call the
          # `GET /user` endpoint (`gh api user` fails with
          # "Resource not accessible by integration"). The noreply email
          # matches the `<id>+<login>@users.noreply.github.com` GitHub
          # convention, so the tag is attributed to github-actions[bot].
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated tag pointing at the checked-out commit, which carries
          # the reviewed version bump and changelog entry (verified above).
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Dispatch the Release workflow for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Pushing a tag with GITHUB_TOKEN does NOT trigger `on: push: tags`
          # workflows (GitHub suppresses events created by the default token
          # to prevent recursive runs). Dispatch Release explicitly, pinned to
          # the tag ref, so the existing pipeline is reused unchanged.
          gh workflow run release.yml --ref "$TAG"
