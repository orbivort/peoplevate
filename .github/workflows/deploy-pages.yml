name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions needed to deploy to Pages. `id-token: write`
# is required for the official `actions/deploy-pages` action (OIDC-based), and
# `contents: write` lets `actions/deploy-pages` commit the built site to the
# `gh-pages` branch. `pages: write` is required to provision the Pages
# deployment API.
permissions:
  contents: write
  pages: write
  id-token: write

# Only ever deploy the most recent push; cancel any in-flight run for the
# previous commit so the Pages environment is not left in a partial state.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend (mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Keep in sync with the root package.json `packageManager`/`engines`
        # fields (pnpm ^11.21.0, node ^24.19.0).
        # Pin to the commit SHA for supply-chain hardening. Resolve via:
        #   git ls-remote https://github.com/pnpm/action-setup.git v5
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Setup Node.js
        # Pin to the commit SHA for supply-chain hardening. Resolve via:
        #   git ls-remote https://github.com/actions/setup-node.git v5
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          # Serve the static site entirely from the in-memory MSW mock store so
          # GitHub Pages can run the app without a backend. The flag is baked in
          # at build time by Vite.
          VITE_USE_MOCK: 'true'
          # GitHub Pages project sites are hosted under a subpath
          # (https://<owner>.github.io/<repo>/), so assets must be rooted there.
          VITE_BASE_PATH: '/peoplevate/'
          # Set to match the CI policy. This workflow only builds the static
          # frontend (no backend process), so EMAIL_MODE is inert here, but
          # keeping it consistent avoids surprises if the build ever gains
          # backend env validation.
          EMAIL_MODE: mock
        run: pnpm --filter @peoplevate/frontend build

      - name: Inject Cloudflare Web Analytics
        if: vars.CF_ANALYTICS_TOKEN != ''
        shell: node {0}
        env:
          CF_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          const fs = require('fs');
          const path = './packages/frontend/dist/index.html';
          const html = fs.readFileSync(path, 'utf8');
          const snippet = `<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "${process.env.CF_TOKEN}"}'></script>`;
          if (html.includes(snippet)) {
            console.log('Cloudflare Analytics already injected, skipping');
          } else {
            const updated = html.replace('</head>', snippet + '</head>');
            if (updated === html) {
              console.error('ERROR: </head> not found in index.html');
              process.exit(1);
            }
            fs.writeFileSync(path, updated);
            console.log('Cloudflare Analytics injected successfully');
          }

      - name: Add security headers
        run: |
          cd packages/frontend/dist
          cat > _headers << 'EOF'
          /*
            X-Frame-Options: DENY
            X-XSS-Protection: 1; mode=block
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          *.html
            Cache-Control: no-cache
          EOF

      - name: Upload Pages artifact
        # Pin to the commit SHA for supply-chain hardening. Resolve via:
        #   git ls-remote https://github.com/actions/upload-pages-artifact.git v3
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    # The Pages environment is where the deployment is recorded and where the
    # URL is exposed. Configure `github-pages` in the repository/environment
    # settings, or use the site created automatically for this project.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Pin to the commit SHA for supply-chain hardening. Resolve via:
        #   git ls-remote https://github.com/actions/deploy-pages.git v5
        uses: actions/deploy-pages@v5
