packages:
  - 'packages/*'
  - 'packages/config/*'

# Fail install/build when the local Node/pnpm version does not match the
# `engines` field. In pnpm v11 this is configured here (not in .npmrc, where
# pnpm-specific settings are ignored).
engineStrict: true

# Control which dependencies may run postinstall/lifecycle scripts.
# In pnpm v11, `allowBuilds` is the ONLY supported build-setting key; the legacy
# onlyBuiltDependencies / ignoredBuiltDependencies keys were removed and ignored.
# Anything not listed defaults to DENIED, so every package that needs a build
# script must be explicitly set to `true`.
allowBuilds:
  '@prisma/client': true # generates Prisma client / query engine
  '@prisma/engines': true # downloads Prisma query engine binaries
  argon2: true # native module, must compile to work
  esbuild: true # installs platform binary (Vite/tsx dependency)
  prisma: true # prisma CLI generate
  msw: false # postinstall only preps its service worker; Vite serves it from public/

# Force transitive dependency `ini` to a patched version to fix
# GHSA-qqgx-2p2h-9c37 (Prototype Pollution in ini <1.3.6).
# NOTE: In pnpm v11 these settings MUST be top-level keys (not nested under
# `pnpm:`), otherwise they are silently ignored.
overrides:
  global-prefix>ini: 1.3.8
  # Force `nanoid` (pulled by postcss via vite/vitest/stylelint) to a patched
  # version to fix GHSA-2v37-7h3g-55p8 (infinite loop when size is zero).
  nanoid: 3.3.18
  # Force `deepmerge-ts` (pulled by prisma CLI via @prisma/config) to a patched
  # version to fix GHSA-ggr8-5vv4-36mx / CVE-2026-40345 (stack exhaustion when
  # merging recursive object graphs). Prisma has not yet released a version that
  # depends on deepmerge-ts >= 8.0.0; the override is safe because @prisma/config
  # only merges plain object/array config files (no Maps, no deepmergeInto, no
  # deepmergeCustom with a MetaDataUpdater).
  deepmerge-ts: 8.0.2
  # Force `mysql2` (pulled by the prisma CLI, which still pins 3.15.3 exactly)
  # to a patched version to fix GHSA-3f6p-5ww8-9rcr (auth plugin downgrade to
  # mysql_clear_password leaks plaintext credentials, patched >=3.22.0) and
  # GHSA-rgwj-5xj2-c3m3 (unbounded zlib inflate decompression-bomb DoS, patched
  # >=3.23.1). Peoplevate only uses PostgreSQL, so mysql2 is never loaded at
  # runtime; the override keeps `pnpm audit` clean while the prisma CLI remains a
  # dev dependency.
  mysql2: 3.24.3
  # Force `fast-uri` (pulled by ajv v8, which is used by the prisma CLI via
  # @prisma/dev > @prisma/streams-local and by stylelint via table) to a patched
  # version to fix GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf
  # and GHSA-jqff-g426-hqxp (SSRF / host-confusion via URI normalization, all
  # patched in >=3.1.6). 3.1.7 is the newest release in the 3.x range that ajv
  # declares (^3.0.1), so a 4.x override would break the declared contract.
  fast-uri: 3.1.7
  # Force `qs` (pulled by express, body-parser and supertest's superagent) to a
  # patched version to fix GHSA-x5fp-wj9c-mxmx (array-limit bypass via
  # bracket-key comma parsing, patched >=6.15.4) and GHSA-4mjr-xmp4-gh2g
  # (Denial of Service via an attacker-controlled isBuffer, patched >=6.16.0).
  qs: 6.16.0

# Shared dependency versions across all packages
catalog:
  typescript: ^6.0.0
  eslint: ^10.8.0
  '@eslint/js': ^10.0.1
  '@types/node': ^24.13.3
  cross-env: ^10.1.0
  vitest: ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  typescript-eslint: ^8.66.0
  globals: ^17.9.0

minimumReleaseAgeExclude:
  - nanoid@3.3.18
