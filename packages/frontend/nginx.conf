# Peoplevate frontend — Nginx configuration.
#
# Serves the static React SPA build and proxies /api to the backend service.
# The backend service name/port must match the docker-compose.yml definition.
# GZIP is enabled for the asset-heavy bundles produced by Vite.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep asset responses cacheable (content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health endpoint that also verifies the web server is reachable.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy the backend's /health endpoint (it lives outside the /api prefix).
    location = /health {
        proxy_pass http://backend:4000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API traffic to the backend container.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # SPA fallback: unknown routes serve index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip static text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
