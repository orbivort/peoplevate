<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for any URL that does not match a real
      // file (e.g. refreshing on /login or /app/profile). This snippet moves the
      // requested path onto the query string of the site root and redirects
      // there, where the SPA restores the deep link so the router (scoped to the
      // /peoplevate/ basename) can serve it. Preserving the full path here keeps
      // 404.html independent of the exact deployment subpath.
      (function () {
        var basePath = '/peoplevate';
        var path = window.location.pathname + window.location.search + window.location.hash;
        var redirect = basePath + '?p=' + encodeURIComponent(path);
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
