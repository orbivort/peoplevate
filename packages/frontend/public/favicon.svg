<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12c08b"/>
      <stop offset="1" stop-color="#0b8f68"/>
    </linearGradient>
  </defs>

  <!-- Rounded background tile -->
  <rect width="24" height="24" rx="6" fill="url(#bg)"/>

  <!-- Lifecycle loop — thin, secondary ring around the P -->
  <path d="M12 4.2 A 7.8 7.8 0 1 1 4.6 10"
        stroke="#eafff6" stroke-width="1.3" stroke-linecap="round" opacity="0.45" fill="none"/>
  <!-- Loop arrowhead -->
  <path d="M4.4 9.2 L2.9 11.4 L5.5 11.6 Z" fill="#eafff6" opacity="0.45"/>
  <!-- Lifecycle milestone dots -->
  <circle cx="12" cy="4.4" r="0.7" fill="#eafff6" opacity="0.45"/>
  <circle cx="19.4" cy="12" r="0.7" fill="#eafff6" opacity="0.45"/>

  <!-- Bold solid block-letter 'P' -->
  <path fill-rule="evenodd" fill="#ffffff"
        d="M9 18.5 V6 H12.8 C16.4 6 17.8 8.3 17.8 11.3 C17.8 14.3 16.4 16.6 12.8 16.6 V18.5 Z
           M12.8 7.9 V14.7 C15 14.7 15.9 13.5 15.9 11.3 C15.9 9.1 15 7.9 12.8 7.9 Z"/>

  <!-- Upward growth arrow above the stem -->
  <path d="M9 6 L12 3.6 L15 6" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
